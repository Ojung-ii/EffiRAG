dataset: hotpotqa
split: validation
method: effirag
output_dir: outputs/rag
limit: 100
global_corpus_path: ""
graph_cache_dir: outputs/index_cache
force_rebuild_graph_index: false

graph_mode: entity_chunk_graph
index_chunk_unit: passage
passage_chunking_strategy: sentence_window
passage_chunk_size_sentences: 3
passage_chunk_stride_sentences: 2
passage_chunk_min_sentences: 2
passage_chunk_max_chars: 900
chunk_node_enabled_in_diffusion: false
chunk_scoring_mode: entity_aggregate
chunk_package_enabled: true
chunk_score_topk: 8

openie_mode: llm
openie_model_name: Qwen/Qwen2.5-7B-Instruct
openie_text_max_chars: 2200
openie_max_new_tokens: 256

embedding_enabled: true
sentence_rerank_enabled: true
embedding_model_name: nvidia/NV-Embed-v2
embedding_text_max_chars: 800
embedding_weight: 0.35
embedding_rerank_topn: 80
embedding_batch_size: 16
embedding_max_length: 256
semantic_topn_entity: 30
semantic_topn_chunk: 15
graph_reserve_topn: 15
semantic_topn: 50
semantic_candidate_union: true
semantic_scan_batch_size: 8192

run_score_semantic_weight: 0.30
run_score_anchor_weight: 0.20
run_score_structure_weight: 0.25
run_score_bridge_weight: 0.15
run_score_redundancy_weight: 0.10
# Retrieval-objective switchboard (default off/baseline).
# Supported:
# - baseline
# - hybrid_anchor_recall / bridge_candidate_induction / role_aware_chunk_scoring
# - coverage_selection / bridge_coverage_full
# - r2_bridge_only / r2_plus_r3_anchor_light / r2_plus_r3_answer_light
# - seed_quality_analysis / run_objective_bridge_aware / run_objective_role_balanced
# - corridor_role_constrained / bridge_aware_run_plus_role_constrained_corridor
# - seed_run_connector_core
# - seed_run_connector_core_corridor_compact
# - seed_run_connector_core_corridor_answer_preserve
# - seed_run_connector_core_corridor_bridge_purity
# - seed_run_connector_core_corridor_compact_answer_preserve
# - p3_answer_preserve_base
# - p3_answer_preserve_guarded_hotpot
# - p3_answer_preserve_confidence_gated
# - r2_connector_core
# - r2_plus_path_preserve
# - r2_plus_path_preserve_compact
# - r2_plus_path_preserve_guarded
# - r2_plus_path_preserve_compact_lite
retrieval_objective_mode: baseline
hybrid_anchor_recall_enabled: false
hybrid_anchor_semantic_topn: 2
hybrid_anchor_alias_boost: 0.10
bridge_candidate_induction_enabled: false
bridge_candidate_max_hops: 4
bridge_candidate_per_pair_topn: 8
bridge_candidate_global_topn: 48
bridge_candidate_semantic_weight: 0.45
bridge_candidate_path_weight: 0.35
bridge_candidate_degree_weight: 0.20
role_aware_chunk_scoring_enabled: false
role_chunk_weight_anchor_match: 0.30
role_chunk_weight_bridge_support: 0.30
role_chunk_weight_answer_likelihood: 0.25
role_chunk_weight_path_consistency: 0.15
coverage_selection_enabled: false
coverage_selection_role_weight: 0.35
coverage_selection_redundancy_weight: 0.10
canonical_variant_name: a1_baseline_3_2
# Shared Stage G/T budget profile (default keeps D1 baseline unchanged).
# alias: proposal_light == g1_proposal
shared_budget_profile: off
shared_budget_proposal_step: 0
shared_budget_exploration_step: 0
# Set this to D2 F1 for oracle_gap calculation (0.0 disables gap calc).
oracle_ceiling_f1: 0.0
run_light_rerank_enabled: false
run_light_rerank_topk: 5
run_light_rerank_weight_base: 0.72
run_light_rerank_weight_bridge_completeness: 0.12
run_light_rerank_weight_anchor_coverage: 0.08
run_light_rerank_weight_grounding: 0.08
stagewise_loss_funnel_enabled: true
final_top_slice_reorder_enabled: false
final_top_slice_reorder_topk: 4
answer_support_pinning_enabled: false
answer_support_pinning_min: 1
oracle_support_injection_enabled: false
seed_score_semantic_weight: 0.35
seed_score_graph_weight: 0.45
seed_score_anchor_weight: 0.20
seed_objective_bridge_weight: 0.20
seed_objective_grounding_weight: 0.15
seed_objective_anchor_coverage_weight: 0.10
corridor_compact_shaping_enabled: false
corridor_answer_preserve_enabled: false
corridor_bridge_purity_shaping_enabled: false
corridor_path_preserve_enabled: false
corridor_path_preserve_compact_enabled: false
corridor_path_preserve_guarded_enabled: false
corridor_path_preserve_compact_lite_enabled: false
corridor_answer_preserve_guarded_hotpot_enabled: false
corridor_answer_preserve_confidence_gated_enabled: false
corridor_compact_weight: 0.00
corridor_answer_preserve_weight: 0.00
corridor_bridge_purity_weight: 0.00
corridor_path_preserve_weight: 0.00
corridor_path_preserve_incomplete_penalty_weight: 0.00
corridor_path_preserve_compact_weight: 0.00
corridor_path_preserve_anchor_threshold: 0.35
corridor_path_preserve_bridge_threshold: 0.35
corridor_path_preserve_answer_threshold: 0.55
corridor_path_preserve_pair_threshold: 0.45
corridor_path_preserve_guard_scale: 0.70
corridor_path_preserve_guard_min_complete_score: 0.70
corridor_path_preserve_guard_min_pair_retention: 0.55
corridor_path_preserve_guard_min_answer_density: 0.62
corridor_path_preserve_compact_lite_scale: 0.65
corridor_path_preserve_compact_lite_overflow_coeff: 0.015
corridor_path_preserve_compact_lite_overflow_cap: 0.08
corridor_answer_preserve_min_density: 0.30
corridor_answer_preserve_light_boost_scale: 0.65
corridor_answer_preserve_bridge_consistency_threshold: 0.55
corridor_answer_preserve_confidence_threshold: 0.62
corridor_answer_preserve_hotpot_anchor_bridge_sufficient: 0.70
corridor_answer_preserve_hotpot_answer_density_cap: 0.72
corridor_answer_preserve_hotpot_quota_cap: 0.40
corridor_answer_preserve_hotpot_relax_factor: 0.35
hotpot_overpreserve_answer_share_threshold: 0.10

max_anchors: 3
samples_per_anchor: 3
# Keep 1 by default to avoid shared index/cache/meta write races with process-level retrieval workers.
num_workers: 1
candidate_top_t: 20
seed_k: 4
pair_top_lp: 3
corridor_top_bc: 20
phase1_parallel_ppr: true
phase1_run_shortlist_topk: 2
phase1_run_preshortlist_topm: 2
phase1_full_run_score_topk: 2
pair_shortlist_topb: 4
phase2_refine_mode: bounded_local
phase2_bidirectional_full_ppr: false
reuse_semantic_scores_in_final: true
corridor_fallback_text_cap: 4
top1_correction_enabled: false
top1_correction_topk: 5
trim_on: true
trim_rho: 0.6

run_qa: true
generator: heuristic
model_name: ""
max_context_sentences: 8
# flat | corridor | corridor_aware_flat | path_bundle
render_mode: corridor_aware_flat
max_corridors_in_context: 3
max_main_sentences_per_corridor: 2
max_support_per_corridor: 1
max_total_sentences: 8
max_sentences: 8
eta_connector: 0.20
lambda_redundancy: 0.25
reserve_top_corridor: false
# score | retrieval | corridor_rank | query_bridge_answer
# path_bundle mode flags:
# - path_bundle_ordered
# - path_bundle_chain_summary
# - path_bundle_derivation_prompt
# - path_bundle_top1_focus (or path_bundle_top2_focus)
# - path_bundle_dedup
# - path_bundle_compactlite
# corridor_aware_flat generation-side minimal intervention flags:
# - gen_quote_then_answer_light
# - gen_grounded_answer_light
# - gen_evidence_focus_light
# - gen_light_ab_chain / gen_light_ab_wording
order_strategy: score
# Minimal downstream options (Set F): use config-level toggles.
# - final_top_slice_reorder_enabled: true
# - answer_support_pinning_enabled: true
# D2 oracle upper-bound (diagnostic only): oracle_support_injection_enabled: true
# A2 (s1_diversity): lambda_redundancy=0.30 (3/2)
# C1 (relation-aware ordering): order_strategy=relation_on
# C2 (relation-aware + connector priority): order_strategy=relation_on + eta_connector up
measure_gpu_peak: false
measure_cpu_ram: true

ppr_alpha: 0.15
tau: 4
edge_drop_prob: 0.1
random_seed: 42
