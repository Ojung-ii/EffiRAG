dataset: hotpotqa
split: validation
method: effirag
output_dir: outputs/retrieval
limit: 100
global_corpus_path: ""
graph_cache_dir: outputs/index_cache
force_rebuild_graph_index: false

# Recommended entity-chunk setting:
# - search/diffusion stays entity-centric for stability
# - chunks are used for proposal grounding and final context delivery
graph_mode: entity_chunk_graph
index_chunk_unit: passage
passage_chunking_strategy: sentence_window
passage_chunk_size_sentences: 3
passage_chunk_stride_sentences: 2
passage_chunk_min_sentences: 2
passage_chunk_max_chars: 900
chunk_node_enabled_in_diffusion: false
chunk_scoring_mode: entity_aggregate
chunk_package_enabled: true
chunk_score_topk: 8

openie_mode: llm
openie_model_name: Qwen/Qwen2.5-7B-Instruct
openie_text_max_chars: 2200
openie_max_new_tokens: 256

embedding_enabled: true
embedding_model_name: nvidia/NV-Embed-v2
embedding_text_max_chars: 600
embedding_weight: 0.35
embedding_rerank_topn: 80
embedding_batch_size: 16
embedding_max_length: 192
semantic_topn_entity: 30
semantic_topn_chunk: 15
graph_reserve_topn: 15
semantic_topn: 50
semantic_candidate_union: true
semantic_scan_batch_size: 8192

run_score_semantic_weight: 0.30
run_score_anchor_weight: 0.20
run_score_structure_weight: 0.25
run_score_bridge_weight: 0.15
run_score_redundancy_weight: 0.10
canonical_variant_name: a1_baseline_3_2
run_light_rerank_enabled: false
run_light_rerank_topk: 5
run_light_rerank_weight_base: 0.72
run_light_rerank_weight_bridge_completeness: 0.12
run_light_rerank_weight_anchor_coverage: 0.08
run_light_rerank_weight_grounding: 0.08
stagewise_loss_funnel_enabled: true
# Minimal downstream levers (default off): keep retrieval objective unchanged.
final_top_slice_reorder_enabled: false
final_top_slice_reorder_topk: 4
answer_support_pinning_enabled: false
answer_support_pinning_min: 1
# Diagnostic-only oracle support injection for D2 upper-bound checks.
oracle_support_injection_enabled: false
# Track H/W retrieval-expansion knobs (change one axis at a time):
# - Proposal-only: semantic_topn_entity / semantic_topn_chunk / graph_reserve_topn
# - Exploration-only: max_anchors / samples_per_anchor / phase1_run_preshortlist_topm / phase1_full_run_score_topk
# - Minimal downstream preservation: final_top_slice_reorder_enabled or answer_support_pinning_enabled (one at a time)
seed_score_semantic_weight: 0.35
seed_score_graph_weight: 0.45
seed_score_anchor_weight: 0.20
seed_objective_bridge_weight: 0.20
seed_objective_grounding_weight: 0.15
seed_objective_anchor_coverage_weight: 0.10

max_anchors: 3
samples_per_anchor: 3
# Keep 1 by default to avoid shared index/cache/meta write races with process-level retrieval workers.
num_workers: 1
candidate_top_t: 20
seed_k: 4
pair_top_lp: 3
corridor_top_bc: 20
phase1_parallel_ppr: true
phase1_run_shortlist_topk: 2
# Conservative starter bumps for this round:
# - Proposal-only: 30/15/15 -> 36/18/18
# - Exploration-only: 3/3/2/2 -> 4/4/3/3
phase1_run_preshortlist_topm: 2
phase1_full_run_score_topk: 2
pair_shortlist_topb: 4
phase2_refine_mode: bounded_local
phase2_bidirectional_full_ppr: false
reuse_semantic_scores_in_final: true
corridor_fallback_text_cap: 4
top1_correction_enabled: false
top1_correction_topk: 5
trim_on: true
trim_rho: 0.6

ppr_alpha: 0.15
tau: 4
edge_drop_prob: 0.1
random_seed: 42
