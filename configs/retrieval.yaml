dataset: hotpotqa
split: validation
method: effirag
output_dir: outputs/retrieval
limit: 100

max_anchors: 4
samples_per_anchor: 8
num_workers: 4
candidate_top_t: 20
seed_k: 4
pair_top_lp: 4
corridor_top_bc: 20
trim_on: true
trim_rho: 0.75

ppr_alpha: 0.15
tau: 4
edge_drop_prob: 0.1
random_seed: 42
