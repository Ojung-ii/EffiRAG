dataset: hotpotqa
split: validation
method: effirag
output_dir: outputs/rag
limit: 100
global_corpus_path: ""
graph_cache_dir: outputs/index_cache
force_rebuild_graph_index: false

max_anchors: 6
samples_per_anchor: 8
num_workers: 1
candidate_top_t: 20
seed_k: 4
pair_top_lp: 3
corridor_top_bc: 20
trim_on: true
trim_rho: 0.6

run_qa: true
generator: heuristic
model_name: ""
max_context_sentences: 10
render_mode: ""
max_corridors_in_context: 2
max_main_sentences_per_corridor: 2
max_support_per_corridor: 1
max_total_sentences: 12
measure_gpu_peak: false
measure_cpu_ram: true

ppr_alpha: 0.15
tau: 4
edge_drop_prob: 0.1
random_seed: 42
